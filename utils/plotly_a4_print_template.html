<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        /* 通用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial", "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* 屏幕显示样式 */
        .page {
            background: white;
            margin: 0 auto 20px auto;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            /* A4 纵向尺寸 */
            width: 210mm;
            min-height: 297mm;
            position: relative;
        }

        .page.landscape {
            /* A4 横向尺寸 */
            width: 297mm;
            min-height: 210mm;
        }

        .chart-container {
            width: 100%;
            height: auto;
            margin: 10px 0;
        }

        .page-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        .page-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .page-header .subtitle {
            font-size: 14px;
            color: #666;
        }

        .page-footer {
            position: absolute;
            bottom: 15mm;
            left: 20mm;
            right: 20mm;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 5px;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .page {
                margin: 0;
                padding: 20mm;
                box-shadow: none;
                page-break-after: always;
                width: 210mm;
                height: 297mm;
            }

            .page.landscape {
                width: 297mm;
                height: 210mm;
            }

            .page:last-child {
                page-break-after: auto;
            }

            /* 确保图表不被分页切割 */
            .chart-container {
                page-break-inside: avoid;
            }

            /* 打印时隐藏不需要的元素 */
            .no-print {
                display: none !important;
            }

            /* 打印按钮隐藏 */
            .print-button {
                display: none !important;
            }
        }

        /* A4 纵向的打印媒体查询 */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @page :first {
            margin-top: 0;
        }

        /* 如果需要横向打印，使用这个类 */
        @media print {
            .landscape-print {
                size: A4 landscape;
            }
        }

        /* 打印按钮样式 */
        .print-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .print-button:hover {
            background-color: #45a049;
        }

        .print-button:active {
            transform: translateY(1px);
        }

        /* 图表说明文字 */
        .chart-description {
            margin: 10px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 打印按钮 -->
    <button class="print-button no-print" onclick="window.print()">🖨️ 打印 / 保存为PDF</button>

    {{content}}

    <script>
        // 确保图表在打印前完全渲染
        window.addEventListener('beforeprint', function() {
            console.log('准备打印...');
            // 可以在这里添加图表刷新逻辑
        });

        window.addEventListener('afterprint', function() {
            console.log('打印完成');
        });

        // 自适应调整
        function resizeCharts() {
            var charts = document.querySelectorAll('.plotly-graph-div');
            charts.forEach(function(chart) {
                Plotly.Plots.resize(chart);
            });
        }

        window.addEventListener('resize', resizeCharts);
        window.addEventListener('load', resizeCharts);
    </script>
</body>
</html>
