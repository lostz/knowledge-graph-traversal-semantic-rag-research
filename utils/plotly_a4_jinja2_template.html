<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* 通用样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial", "Microsoft YaHei", "SimHei", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* 屏幕显示样式 */
        .page {
            background: white;
            margin: 0 auto 20px auto;
            padding: 20mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }

        /* A4 纵向尺寸 */
        .page.portrait {
            width: 210mm;
            min-height: 297mm;
        }

        /* A4 横向尺寸 */
        .page.landscape {
            width: 297mm;
            min-height: 210mm;
        }

        .page-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        .page-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .page-header .subtitle {
            font-size: 14px;
            color: #666;
        }

        .page-footer {
            position: absolute;
            bottom: 15mm;
            left: 20mm;
            right: 20mm;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 5px;
        }

        .chart-container {
            width: 100%;
            text-align: center;
            margin: 10px 0;
            page-break-inside: avoid;
        }

        .chart-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .chart-description {
            margin: 10px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
            line-height: 1.6;
        }

        /* 打印按钮样式 */
        .print-button {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .print-button:hover {
            background-color: #45a049;
        }

        .print-button:active {
            transform: translateY(1px);
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .page {
                margin: 0;
                padding: 20mm;
                box-shadow: none;
                page-break-after: always;
            }

            .page.portrait {
                width: 210mm;
                height: 297mm;
            }

            .page.landscape {
                width: 297mm;
                height: 210mm;
            }

            .page:last-child {
                page-break-after: auto;
            }

            /* 确保图表不被分页切割 */
            .chart-container {
                page-break-inside: avoid;
            }

            /* 打印时隐藏不需要的元素 */
            .no-print, .print-button {
                display: none !important;
            }

            /* 确保图片在打印时正确显示 */
            .chart-container img {
                max-width: 100%;
                height: auto;
            }
        }

        /* A4 页面设置 */
        @page {
            size: A4 {{ 'landscape' if orientation == 'landscape' else 'portrait' }};
            margin: 0;
        }
    </style>
</head>
<body>
    <!-- 打印按钮 -->
    <button class="print-button no-print" onclick="window.print()">🖨️ 打印 / 保存为PDF</button>

    {% for page in pages %}
    <div class="page {{ orientation }}">
        <div class="page-header">
            <h1>{{ page.title }}</h1>
            {% if page.subtitle %}
            <div class="subtitle">{{ page.subtitle }}</div>
            {% endif %}
        </div>

        {% if page.description %}
        <div class="chart-description">{{ page.description }}</div>
        {% endif %}

        <div class="chart-container">
            <img src="data:image/png;base64,{{ page.image_base64 }}" alt="{{ page.title }}">
        </div>

        <div class="page-footer">
            Page {{ loop.index }}{% if pages|length > 1 %} of {{ pages|length }}{% endif %} | Generated with Plotly
        </div>
    </div>
    {% endfor %}
</body>
</html>
